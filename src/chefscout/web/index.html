<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dishly · הרעיון הבא שלך במטבח</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%23C2562F'/%3E%3Cpath d='M7 15h18a9 9 0 01-18 0z' fill='%23FFFDF8'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Assistant:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <!-- Line icons (SVG sprite), used with <use href="#..."> from the page and from app.js. -->
  <svg class="sprite" aria-hidden="true" focusable="false">
    <symbol id="i-bowl" viewBox="0 0 32 32"><path d="M11 5c-1 1.5 1 2.5 0 4M16 4c-1 1.5 1 2.5 0 4M21 5c-1 1.5 1 2.5 0 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M4 14h24a12 11 0 01-24 0z" fill="currentColor"/><path d="M11 27h10" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
    <symbol id="i-idea" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 00-3.5 10.9c.6.5 1 1.2 1 2V16h5v-.1c0-.8.4-1.5 1-2A6 6 0 0012 3z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-basket" viewBox="0 0 24 24"><path d="M3 10h18l-1.6 9a2 2 0 01-2 1.6H6.6a2 2 0 01-2-1.6zM8 10l3-6M16 10l-3-6M9 14v3M15 14v3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 7.5V12l3 2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M15.5 15.5L21 21" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M5 11a7 7 0 0014 0M12 18v3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-out" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 01-1 1H5a1 1 0 01-1-1V7a1 1 0 011-1h5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-box" viewBox="0 0 24 24"><path d="M3 9h18v10a2 2 0 01-2 2H5a2 2 0 01-2-2zM5 9V6a2 2 0 012-2h3l2 2h5a2 2 0 012 2v1M10 13h4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-new" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-7-4.4-8.6-9A4.6 4.6 0 0112 7.2 4.6 4.6 0 0120.6 11C19 15.6 12 20 12 20z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
    <symbol id="i-pan" viewBox="0 0 24 24"><path d="M3 11h13a6.5 6.5 0 01-13 0zM16 11.5h5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 00-14.3-4.9L4 8M4 4v4h4M4 13a8 8 0 0014.3 4.9L20 16M20 20v-4h-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-leaf" viewBox="0 0 24 24"><path d="M5 19C5 10 11 5 20 4c0 9-5 15-14 15zM5 19l7-7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </svg>

  <header class="topbar">
    <div class="topbar-in">
      <a class="brand" href="/" aria-label="Dishly, דף הבית">
        <svg class="brand-mark" aria-hidden="true"><use href="#i-bowl"/></svg>
        <span class="brand-text">
          <span class="brand-name">Dishly</span>
          <span class="brand-sub">הרעיון הבא שלך במטבח</span>
        </span>
      </a>
      <nav class="top-actions">
        <button id="kitchen-open" class="ghost-btn" type="button" aria-controls="kitchen" aria-expanded="false">
          <svg class="ic" aria-hidden="true"><use href="#i-box"/></svg><span>המטבח שלי</span>
        </button>
        <button id="new-chat" class="ghost-btn" type="button">
          <svg class="ic" aria-hidden="true"><use href="#i-new"/></svg><span>שיחה חדשה</span>
        </button>
      </nav>
    </div>
  </header>

  <div id="banner" class="banner" role="alert" hidden></div>

  <main class="chat" aria-label="שיחה">
    <section id="home" class="home" aria-labelledby="home-title">
      <h1 id="home-title">מה מבשלים היום?</h1>
      <p class="home-lead">ספרי לי מה בא לך או מה יש בבית. אציע כמה רעיונות, ולמה שתבחרי אביא מתכונים אמיתיים מהרשת, שמתאימים למה שאת אוכלת.</p>
      <div class="starters">
        <button type="button" class="starter" data-action="idea"><svg class="ic" aria-hidden="true"><use href="#i-idea"/></svg><span><b>רעיון לארוחת ערב</b><small>שלוש הצעות שונות</small></span></button>
        <button type="button" class="starter" data-action="pantry"><svg class="ic" aria-hidden="true"><use href="#i-basket"/></svg><span><b>ממה שיש בבית</b><small>לפי המצרכים שלך</small></span></button>
        <button type="button" class="starter" data-action="quick"><svg class="ic" aria-hidden="true"><use href="#i-clock"/></svg><span><b>משהו מהיר</b><small>עד 30 דקות</small></span></button>
        <button type="button" class="starter" data-action="search"><svg class="ic" aria-hidden="true"><use href="#i-search"/></svg><span><b>מתכון למשהו מסוים</b><small>"מתכון ל..."</small></span></button>
      </div>
    </section>

    <div id="messages" class="messages" aria-live="polite"></div>

    <section id="working" class="working" aria-live="polite" hidden>
      <div class="working-line">
        <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
        <span id="working-text">חושב…</span>
      </div>
      <div id="skeletons" class="cards" hidden aria-hidden="true">
        <div class="skeleton"><span class="sk-img"></span><span class="sk-line"></span><span class="sk-line short"></span></div>
        <div class="skeleton"><span class="sk-img"></span><span class="sk-line"></span><span class="sk-line short"></span></div>
      </div>
    </section>
  </main>

  <footer class="dock">
    <div class="dock-in">
      <div class="today" aria-label="מה יש בבית היום">
        <span class="today-label"><svg class="ic" aria-hidden="true"><use href="#i-basket"/></svg>בבית היום:</span>
        <div id="pantry" class="today-items"></div>
        <form id="pantry-add" class="today-add" hidden>
          <input id="pantry-input" maxlength="60" placeholder="למשל: ביצים" aria-label="מה יש בבית">
          <button type="submit" class="mini-btn">הוספה</button>
        </form>
        <button id="pantry-open" class="link-btn" type="button"><svg class="ic" aria-hidden="true"><use href="#i-plus"/></svg>הוספה</button>
      </div>
      <div id="reply-to" class="reply-to" hidden>
        <span><svg class="ic" aria-hidden="true"><use href="#i-refresh"/></svg><span id="reply-to-text"></span></span>
        <button id="reply-to-cancel" class="icon-btn" type="button" aria-label="ביטול"><svg class="ic" aria-hidden="true"><use href="#i-x"/></svg></button>
      </div>
      <form id="composer" class="composer">
        <label for="input" class="visually-hidden">הודעה ל-Dishly</label>
        <textarea id="input" rows="1" maxlength="2000" placeholder="מה בא לך היום?" required></textarea>
        <button id="mic" class="icon-btn" type="button" aria-label="הכתבה קולית" aria-pressed="false" hidden><svg class="ic" aria-hidden="true"><use href="#i-mic"/></svg></button>
        <button id="send" class="send-btn" type="submit" aria-label="שליחה"><svg class="ic" aria-hidden="true"><use href="#i-send"/></svg></button>
      </form>
    </div>
  </footer>

  <!-- "My kitchen": what rarely changes (profile) and the notebook of what was cooked. -->
  <div id="scrim" class="scrim" hidden></div>
  <aside id="kitchen" class="drawer" aria-labelledby="kitchen-title" hidden>
    <div class="drawer-head">
      <h2 id="kitchen-title">המטבח שלי</h2>
      <button id="kitchen-close" class="icon-btn" type="button" aria-label="סגירה"><svg class="ic" aria-hidden="true"><use href="#i-x"/></svg></button>
    </div>
    <div class="tabs" role="tablist">
      <button id="tab-profile" class="tab" role="tab" aria-selected="true" aria-controls="panel-profile" type="button">מה אני אוכלת</button>
      <button id="tab-notebook" class="tab" role="tab" aria-selected="false" aria-controls="panel-notebook" type="button">מה הכנתי</button>
    </div>

    <section id="panel-profile" class="panel" role="tabpanel" aria-labelledby="tab-profile">
      <p class="panel-lead">נשמר לתמיד ונבדק בכל מתכון. אפשר גם לכתוב בצ'אט, למשל "אני אלרגית לאגוזים".</p>
      <div id="profile" class="profile"></div>
      <form id="add-pref" class="add-pref">
        <select id="pref-kind" aria-label="סוג">
          <option value="allergy">אלרגיה</option>
          <option value="avoid">לעולם לא</option>
          <option value="kitchen_rule">כלל מטבח</option>
          <option value="diet">תזונה</option>
          <option value="like">אוהבת</option>
        </select>
        <input id="pref-value" maxlength="100" placeholder="למשל: אגוזים" aria-label="מה לשמור" required>
        <button class="mini-btn" type="submit">שמירה</button>
      </form>
    </section>

    <section id="panel-notebook" class="panel" role="tabpanel" aria-labelledby="tab-notebook" hidden>
      <ul id="cooked" class="notebook"></ul>
    </section>
  </aside>

  <div id="toast" class="toast" role="status" hidden></div>

  <!-- A recipe card, like an index card from a recipe box. Filled by app.js from the server's card data only. -->
  <template id="recipe-card">
    <article class="rcard">
      <span class="r-tab"></span>
      <img class="r-img" alt="" loading="lazy" referrerpolicy="no-referrer">
      <div class="r-body">
        <div class="r-site"></div>
        <h3 class="r-title"></h3>
        <div class="r-meta"></div>
        <p class="r-note"><svg class="ic" aria-hidden="true"><use href="#i-leaf"/></svg><span></span></p>
        <div class="r-rule">
          <div class="r-sec-h">נגד כלל המטבח שלך</div>
          <ul class="r-items"></ul>
        </div>
        <details class="r-missing">
          <summary></summary>
          <ul class="r-items"></ul>
        </details>
        <div class="r-have"><svg class="ic" aria-hidden="true"><use href="#i-check"/></svg>יש לך את כל המצרכים</div>
        <div class="r-actions">
          <a class="r-go recipe-link" target="_blank" rel="noopener noreferrer">למתכון <svg class="ic" aria-hidden="true"><use href="#i-out"/></svg></a>
          <button class="r-btn recipe-cooked" type="button"><svg class="ic" aria-hidden="true"><use href="#i-pan"/></svg>הכנתי</button>
          <button class="r-btn recipe-save" type="button"><svg class="ic" aria-hidden="true"><use href="#i-heart"/></svg>שמירה</button>
          <details class="r-other">
            <summary class="r-btn"><svg class="ic" aria-hidden="true"><use href="#i-refresh"/></svg>מתכון אחר</summary>
            <div class="menu">
              <button type="button" class="other-more">עוד מתכון לאותה מנה</button>
              <button type="button" class="other-variant">בגרסה אחרת…</button>
            </div>
          </details>
        </div>
        <div class="rating" hidden>
          <span>איך יצא?</span>
          <button type="button" data-rating="loved">אהבתי</button>
          <button type="button" data-rating="ok">בסדר</button>
          <button type="button" data-rating="disliked">לא בשבילי</button>
        </div>
      </div>
    </article>
  </template>

  <script src="/static/app.js"></script>
</body>
</html>
